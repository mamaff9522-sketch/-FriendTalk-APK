<!doctype html>
<html lang="th" class="bg-[#0a0820]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0820">
<title>FriendTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;1,700;1,800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#0a0820', panel: '#120f2c', card: '#16123a', line: '#2a2357',
        neon: '#ff2fa8', violet: '#b04dff', muted: '#a49cc8'
      },
      fontFamily: { th: ['Kanit', 'Sarabun', 'sans-serif'], body: ['Sarabun', 'Kanit', 'sans-serif'] }
    }
  }
};
</script>
<style>
  :root { --neon: #ff2fa8; --violet: #b04dff; }
  html, body { background: #0a0820; color: #f4f1ff; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Kanit', 'Sarabun', system-ui, sans-serif; overscroll-behavior-y: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .brand { font-family: 'Kanit', sans-serif; font-style: italic; font-weight: 800; letter-spacing: -.5px; }
  .glow-text { text-shadow: 0 0 10px rgba(255, 47, 168, .75), 0 0 22px rgba(176, 77, 255, .45); }
  .glow-white { text-shadow: 0 0 10px rgba(214, 160, 255, .65); }
  .neon-border { border: 1.5px solid rgba(190, 90, 255, .75); box-shadow: 0 0 12px rgba(176, 77, 255, .45), inset 0 0 10px rgba(176, 77, 255, .15); }
  .ring-neon { background: conic-gradient(from 200deg, #ff2fa8, #b04dff, #6d5bff, #ff2fa8); box-shadow: 0 0 14px rgba(190, 80, 255, .7); }
  .card-glow { box-shadow: 0 0 0 1px rgba(120, 90, 220, .25), 0 6px 22px rgba(10, 5, 40, .6); }
  .icon-glow { filter: drop-shadow(0 0 6px rgba(190, 90, 255, .95)); }
  .pink-glow { filter: drop-shadow(0 0 6px rgba(255, 47, 168, .8)); }
  .skel { background: linear-gradient(90deg, #17133a 0%, #221c4d 50%, #17133a 100%); background-size: 200% 100%; animation: sk 1.3s infinite linear; }
  @keyframes sk { to { background-position: -200% 0; } }
  .sheet-enter { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  .safe-b { padding-bottom: env(safe-area-inset-bottom); }
  input::placeholder, textarea::placeholder { color: #8e86b8; }
  /* สัดส่วนตามภาพต้นแบบ: เห็นการ์ดไลฟ์ ~4.75 ใบ และวงกลมคนใกล้คุณ 6 วงต่อหนึ่งจอ */
  .live-w { width: calc((min(100vw, 480px) - 44px) / 4.75); }
  .near-w { width: calc((min(100vw, 480px) - 12px) / 6); }
</style>
</head>
<body class="min-h-screen">
<div id="app" class="relative mx-auto min-h-screen w-full max-w-[480px] bg-ink pb-[72px]">

  <!-- ===== ส่วนหัว ===== -->
  <header class="sticky top-0 z-30 flex items-center gap-1.5 border-b border-line/70 bg-ink/95 px-2.5 pb-2 pt-[max(8px,env(safe-area-inset-top))] backdrop-blur">
    <button id="hdrAvatarBtn" class="relative shrink-0" aria-label="โปรไฟล์">
      <span class="ring-neon block rounded-full p-[2px]">
        <img id="hdrAvatar" alt="" class="h-[38px] w-[38px] rounded-full bg-card object-cover">
      </span>
      <span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-ink bg-[#2bd96b]"></span>
    </button>
    <div class="min-w-0 flex-1 leading-tight">
      <div class="flex items-center gap-0.5">
        <span class="brand whitespace-nowrap text-[21px] leading-none"><span class="glow-white text-white">Friend</span><span class="glow-text text-neon">Talk</span></span>
        <svg class="pink-glow h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="#ff4fc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 0 1 12 6a5 5 0 0 1 7.5 6.6z"/><path d="M15 8.5c1 .2 1.8 1 2 2"/></svg>
      </div>
      <div id="hdrName" class="mt-0.5 truncate text-[11px] text-[#d9d3f7]">&nbsp;</div>
    </div>
    <button id="coinBtn" class="flex shrink-0 items-center gap-1 rounded-full border border-[#5b3a8f] bg-[#1a1440] py-1 pl-1 pr-1 shadow-[0_0_10px_rgba(176,77,255,.35)]" aria-label="เติมเหรียญ">
      <span class="grid h-[18px] w-[18px] place-items-center rounded-full bg-gradient-to-b from-[#ffd84a] to-[#f2a20c] text-[10px] font-bold text-[#8a5200] shadow-[0_0_6px_rgba(255,200,40,.7)]">$</span>
      <span id="coinVal" class="text-[12px] font-medium text-[#ffe08a]">–</span>
      <span class="grid h-5 w-5 place-items-center rounded-full bg-gradient-to-br from-neon to-violet text-[15px] leading-none text-white">+</span>
    </button>
    <button id="gemBtn" class="flex shrink-0 items-center gap-1 rounded-full border border-[#5b3a8f] bg-[#1a1440] py-1 pl-1.5 pr-1 shadow-[0_0_10px_rgba(176,77,255,.35)]" aria-label="เพชร">
      <svg class="h-[15px] w-[15px]" viewBox="0 0 24 24"><path fill="#4fc3ff" d="M6 3h12l4 6-10 12L2 9z"/><path fill="#a5e4ff" d="M6 3l3 6h6l3-6z"/><path fill="#1e88e5" d="M9 9h6l-3 12z"/></svg>
      <span id="gemVal" class="text-[12px] font-medium text-[#bfe8ff]">–</span>
      <span class="grid h-5 w-5 place-items-center rounded-full bg-gradient-to-br from-neon to-violet text-[15px] leading-none text-white">+</span>
    </button>
    <button id="bellBtn" class="relative shrink-0 p-0.5" aria-label="การแจ้งเตือน">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="#e9e4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 15 18 9"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg>
      <span id="bellDot" class="absolute right-0 top-0 hidden h-2 w-2 rounded-full bg-[#ff2d55] shadow-[0_0_6px_#ff2d55]"></span>
    </button>
  </header>

  <!-- ===== หน้าหลัก ===== -->
  <main id="page-home" data-page="home">
    <!-- ไลฟ์สดตอนนี้ -->
    <section class="border-b border-line/60 pb-3 pt-2.5">
      <div class="flex items-center justify-between px-3">
        <h2 class="flex items-center gap-1.5 text-[16px] font-semibold">
          <svg class="pink-glow h-5 w-6" viewBox="0 0 28 24"><rect x="1" y="5" width="18" height="14" rx="3.5" fill="#ff2fa8"/><path d="M20 10l6-3.5v11L20 14z" fill="#ff2fa8"/><circle cx="6.5" cy="9.5" r="1.8" fill="#0a0820"/></svg>
          ไลฟ์สดตอนนี้
        </h2>
        <button data-go="lives" class="flex items-center gap-1 text-[12.5px] text-neon">ดูทั้งหมด <span class="text-base leading-none">›</span></button>
      </div>
      <div id="liveRow" class="no-scrollbar mt-2.5 flex gap-1.5 overflow-x-auto px-2.5"></div>
    </section>

    <!-- คนใกล้คุณ -->
    <section class="pb-3 pt-2.5">
      <div class="flex items-center justify-between px-3">
        <h2 class="flex items-center gap-1.5 text-[16px] font-semibold">
          <svg class="pink-glow h-5 w-5" viewBox="0 0 24 24"><path fill="#ff2fa8" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></svg>
          คนใกล้คุณ
        </h2>
        <button data-tab="friends" class="flex items-center gap-1 text-[12.5px] text-neon">ดูทั้งหมด <span class="text-base leading-none">›</span></button>
      </div>
      <div id="nearRow" class="no-scrollbar mt-2.5 flex overflow-x-auto px-1.5"></div>
    </section>

    <!-- แถบโพสต์ -->
    <section class="px-2.5 pb-2.5">
      <form id="composer" class="neon-border flex items-center gap-2.5 rounded-2xl bg-[#130f30] px-3.5 py-1.5">
        <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="#c48cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        <input id="postText" maxlength="2000" enterkeyhint="send" autocomplete="off" placeholder="โพสต์..." class="min-w-0 flex-1 bg-transparent text-[16px] text-white outline-none">
        <span id="attachPreview" class="hidden"></span>
        <label class="shrink-0 cursor-pointer" aria-label="แนบรูป">
          <input id="postImage" type="file" accept="image/*" class="hidden">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="#c48cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 16l-5-5-8.5 9"/></svg>
        </label>
        <button id="postSend" type="submit" class="hidden h-8 w-8 shrink-0 place-items-center rounded-full bg-gradient-to-br from-neon to-violet" aria-label="โพสต์">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>

    <!-- แท็บ -->
    <nav id="feedTabs" class="flex border-b border-line/60 px-1.5 text-[14px]">
      <button data-feed="all" class="relative px-4 pb-2.5 pt-1">ทั้งหมด</button>
      <button data-feed="near" class="relative px-4 pb-2.5 pt-1">ใกล้คุณ</button>
      <button data-feed="following" class="relative px-4 pb-2.5 pt-1">กำลังติดตาม</button>
    </nav>

    <!-- ฟีด -->
    <section id="feed" class="grid grid-cols-2 items-start gap-2 px-2 pt-2.5"></section>
    <div id="feedMore" class="py-5 text-center text-[13px] text-muted"></div>
  </main>

  <!-- ===== หน้าอื่น ๆ ===== -->
  <main id="page-friends" data-page="friends" class="hidden px-3 pt-3"></main>
  <main id="page-messages" data-page="messages" class="hidden pt-1"></main>
  <main id="page-video" data-page="video" class="hidden px-3 pt-3"></main>
  <main id="page-profile" data-page="profile" class="hidden px-3 pt-4"></main>

  <!-- ===== แถบล่าง ===== -->
  <nav id="bottomNav" class="safe-b fixed bottom-0 left-1/2 z-30 w-full max-w-[480px] -translate-x-1/2 border-t border-line/70 bg-[#0c0a24]/95 backdrop-blur">
    <div class="grid grid-cols-5 pt-1.5">
      <button data-tab="home" class="flex flex-col items-center gap-0.5 pb-1.5">
        <svg class="h-[26px] w-[26px]" viewBox="0 0 24 24"><path class="ic" d="M3.5 10.6 12 3.5l8.5 7.1V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg>
        <span class="text-[11.5px]">หน้าหลัก</span>
      </button>
      <button data-tab="friends" class="flex flex-col items-center gap-0.5 pb-1.5">
        <svg class="h-[26px] w-[26px]" viewBox="0 0 24 24"><path class="ic" d="M12 21s-7-7.4-7-12a7 7 0 0 1 14 0c0 4.6-7 12-7 12z"/><circle class="ic" cx="12" cy="9" r="2.6"/></svg>
        <span class="text-[11.5px]">หาเพื่อน</span>
      </button>
      <button data-tab="messages" class="relative flex flex-col items-center gap-0.5 pb-1.5">
        <span class="relative">
          <svg class="h-[26px] w-[26px]" viewBox="0 0 24 24"><path class="ic" d="M12 3.5c5 0 9 3.5 9 7.8s-4 7.8-9 7.8c-1.1 0-2.2-.2-3.2-.5L4 20.5l1.4-3.9C4 15.2 3 13.3 3 11.3 3 7 7 3.5 12 3.5z"/><circle cx="8" cy="11.3" r="1.1" fill="currentColor"/><circle cx="12" cy="11.3" r="1.1" fill="currentColor"/><circle cx="16" cy="11.3" r="1.1" fill="currentColor"/></svg>
          <span id="msgBadge" class="absolute -right-2.5 -top-1.5 hidden min-w-[18px] rounded-full bg-[#ff2d6f] px-1 text-center text-[11px] font-semibold leading-[18px] text-white shadow-[0_0_8px_#ff2d6f]"></span>
        </span>
        <span class="text-[11.5px]">ข้อความ</span>
      </button>
      <button data-tab="video" class="flex flex-col items-center gap-0.5 pb-1.5">
        <svg class="h-[26px] w-[26px]" viewBox="0 0 24 24"><rect class="ic" x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></svg>
        <span class="text-[11.5px]">วิดีโอ</span>
      </button>
      <button data-tab="profile" class="flex flex-col items-center gap-0.5 pb-1.5">
        <svg class="h-[26px] w-[26px]" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="8" r="4"/><path class="ic" d="M4 20.5c1.2-3.8 4.3-5.5 8-5.5s6.8 1.7 8 5.5"/></svg>
        <span class="text-[11.5px]">โปรไฟล์</span>
      </button>
    </div>
  </nav>

  <!-- ชั้นซ้อน: หน้าเต็มจอ / แผ่นล่าง / แจ้งข้อความ -->
  <div id="overlay" class="fixed inset-0 z-40 hidden"></div>
  <div id="toast" class="pointer-events-none fixed bottom-[100px] left-1/2 z-[60] hidden -translate-x-1/2 rounded-full bg-[#2a1f5c] px-4 py-2 text-[14px] text-white shadow-[0_0_14px_rgba(176,77,255,.6)]"></div>
</div>

<!-- ===== เข้าสู่ระบบ (แสดงเฉพาะตอนยังไม่ได้ล็อกอิน) ===== -->
<div id="login" class="fixed inset-0 z-50 hidden bg-ink">
  <form id="loginForm" class="mx-auto flex min-h-full max-w-[420px] flex-col justify-center gap-3 px-6">
    <div class="mb-4 text-center">
      <div class="brand text-[40px]"><span class="glow-white">Friend</span><span class="glow-text text-neon">Talk</span></div>
      <div class="text-[14px] text-muted">เข้าสู่ระบบเพื่อดูไลฟ์ เพื่อนใกล้คุณ และฟีด</div>
    </div>
    <input id="loginEmail" type="email" required autocomplete="email" placeholder="อีเมล" class="neon-border rounded-2xl bg-[#130f30] px-4 py-3 text-[16px] outline-none">
    <input id="loginPass" type="password" required autocomplete="current-password" placeholder="รหัสผ่าน" class="neon-border rounded-2xl bg-[#130f30] px-4 py-3 text-[16px] outline-none">
    <div id="loginErr" class="min-h-[20px] text-center text-[13px] text-[#ff7aa8]"></div>
    <button class="rounded-2xl bg-gradient-to-r from-neon to-violet py-3 text-[16px] font-semibold shadow-[0_0_16px_rgba(255,47,168,.55)]">เข้าสู่ระบบ</button>
  </form>
</div>

<script>
'use strict';
/* =========================================================================
 * ค่าเชื่อมต่อ backend จริงของ FriendTalk (ดู docs/BACKEND.md)
 * - BRAIN : friendtalk-brain (Cloud Run) — ต้องใส่ origin ของหน้านี้ใน env CORS_ORIGINS
 * - AUTH  : friendtalk-auth (Cloud Run) — ใช้เมื่อไม่ได้ใส่ FIREBASE_API_KEY
 * - DB    : Firebase Realtime Database (REST, อ่านตามกฎ firebase/database.rules.json)
 * - BUCKET: Firebase Storage สำหรับรูปโพสต์ (posts/{uid}/...)
 * - FIREBASE_API_KEY: Web API key ของโปรเจกต์ (ไม่ใช่ความลับ) — ถ้าใส่ จะล็อกอินผ่าน
 *   Google Identity Toolkit โดยตรง ซึ่งรองรับ CORS จากเบราว์เซอร์
 * ======================================================================= */
const CONFIG = {
  BRAIN: 'https://friendtalk-brain-123224091480.asia-southeast1.run.app',
  AUTH: 'https://friendtalk-auth-123224091480.asia-southeast1.run.app',
  DB: 'https://friendtalk-4e623-default-rtdb.asia-southeast1.firebasedatabase.app',
  BUCKET: 'friendtalk-4e623.firebasestorage.app',
  FIREBASE_API_KEY: ''
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => (typeof u === 'string' && /^https:\/\//i.test(u)) ? esc(u) : '';
const fmtNum = n => (Number(n) || 0).toLocaleString('en-US');
const fmtK = n => { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'; return String(n); };
const AVATAR_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#221b4d"/><circle cx="32" cy="25" r="11" fill="#6f5fb8"/><path d="M12 58c3-11 11-16 20-16s17 5 20 16" fill="#6f5fb8"/></svg>');
const avatar = u => safeUrl(u) || AVATAR_FALLBACK;
function timeAgo(t) {
  const s = Math.max(0, (Date.now() - Number(t || 0)) / 1000);
  if (s < 60) return 'เมื่อสักครู่';
  if (s < 3600) return Math.floor(s / 60) + ' นาทีที่แล้ว';
  if (s < 86400) return Math.floor(s / 3600) + ' ชั่วโมงที่แล้ว';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' วันที่แล้ว';
  return new Date(Number(t)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
}
// "~1.2 km" / "~500 m" จาก backend → "1.2 กม." / "500 ม."
const thDist = d => String(d || '').replace(/^~\s*/, '').replace(/\s*km$/i, ' กม.').replace(/\s*m$/i, ' ม.');
const BADGE = '<svg class="inline-block h-[15px] w-[15px] shrink-0 align-[-2px]" viewBox="0 0 24 24"><path fill="#ff2fa8" d="M12 1.8l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3-2.6 1.9-1 3.1-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3.1-2.6-1.9 1-3-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.7 2.7L16.2 9.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}

/* ---------------- การยืนยันตัวตน ---------------- */
const AUTH_KEY = 'ft_web_auth_v1';
let session = null; // { uid, idToken, refreshToken, exp }
function loadSession() { try { session = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { session = null; } }
function saveSession(s) { session = s; try { s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); } catch {} }
const AUTH_ERR = { INVALID_LOGIN_CREDENTIALS: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', INVALID_PASSWORD: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', EMAIL_NOT_FOUND: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  USER_DISABLED: 'บัญชีนี้ถูกระงับ', TOO_MANY_ATTEMPTS_TRY_LATER: 'ลองหลายครั้งเกินไป กรุณารอสักครู่', RATE_LIMITED: 'ลองหลายครั้งเกินไป กรุณารอสักครู่', INVALID_EMAIL: 'รูปแบบอีเมลไม่ถูกต้อง' };

async function postJson(url, body, form = false) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' }, body: form ? new URLSearchParams(body) : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const code = String(j?.error?.message || j?.error || 'AUTH_ERROR').split(' ')[0].split(':')[0]; const e = new Error(AUTH_ERR[code] || code); e.status = r.status; throw e; }
  return j;
}
async function login(email, password) {
  let d;
  if (CONFIG.FIREBASE_API_KEY) {
    const j = await postJson(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CONFIG.FIREBASE_API_KEY}`, { email, password, returnSecureToken: true });
    d = { uid: j.localId, idToken: j.idToken, refreshToken: j.refreshToken, expiresIn: +j.expiresIn };
  } else d = await postJson(CONFIG.AUTH + '/auth/login', { email, password });
  saveSession({ uid: d.uid, idToken: d.idToken, refreshToken: d.refreshToken, exp: Date.now() + (d.expiresIn || 3600) * 1000 });
}
let refreshing = null;
async function idToken(force = false) {
  if (!session) throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { status: 401 });
  if (!force && session.exp - 60e3 > Date.now()) return session.idToken;
  refreshing ||= (async () => {
    try {
      let d;
      if (CONFIG.FIREBASE_API_KEY) {
        const j = await postJson(`https://securetoken.googleapis.com/v1/token?key=${CONFIG.FIREBASE_API_KEY}`, { grant_type: 'refresh_token', refresh_token: session.refreshToken }, true);
        d = { uid: j.user_id, idToken: j.id_token, refreshToken: j.refresh_token, expiresIn: +j.expires_in };
      } else d = await postJson(CONFIG.AUTH + '/auth/refresh', { refreshToken: session.refreshToken });
      saveSession({ uid: d.uid, idToken: d.idToken, refreshToken: d.refreshToken, exp: Date.now() + (d.expiresIn || 3600) * 1000 });
    } catch (e) { if (e.status === 401 || e.status === 400) logout(); throw e; }
    finally { refreshing = null; }
  })();
  await refreshing;
  return session.idToken;
}
function logout() { saveSession(null); location.hash = ''; showLogin(); }

/* ---------------- เรียก API ---------------- */
function netError(e) { return e instanceof TypeError ? Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'), { status: 0 }) : e; }
async function api(path, { method = 'GET', body, retry = true } = {}) {
  const t = await idToken();
  let r;
  try {
    r = await fetch(CONFIG.BRAIN + path, { method, headers: { Authorization: 'Bearer ' + t, Accept: 'application/json', ...(method !== 'GET' && method !== 'DELETE' ? { 'Content-Type': 'application/json' } : {}) },
      body: method !== 'GET' && method !== 'DELETE' ? JSON.stringify(body || {}) : undefined });
  } catch (e) { throw netError(e); }
  if (r.status === 401 && retry) { await idToken(true); return api(path, { method, body, retry: false }); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error(j?.error || `เกิดข้อผิดพลาด (${r.status})`), { status: r.status, data: j });
  return j;
}
// Realtime Database REST
async function rtdb(path, params = {}, { method = 'GET', body } = {}) {
  const q = new URLSearchParams({ auth: await idToken(), ...params });
  let r;
  try { r = await fetch(`${CONFIG.DB}/${path}.json?${q}`, { method, body: body === undefined ? undefined : JSON.stringify(body) }); } catch (e) { throw netError(e); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error(j?.error || `HTTP ${r.status}`), { status: r.status });
  return j;
}
const userCache = new Map();
function userOf(uid) {
  if (!uid) return Promise.resolve({});
  if (!userCache.has(uid)) userCache.set(uid, rtdb('users/' + encodeURIComponent(uid)).then(u => u || {}).catch(() => ({})));
  return userCache.get(uid);
}

// ย่อรูปไม่เกิน 1600px เป็น JPEG ~85% (เหมือนแอป Android)
async function compressImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('อ่านรูปไม่ได้')), 'image/jpeg', 0.85));
}
async function uploadPostImage(file) {
  const blob = await compressImage(file);
  if (blob.size > 10 * 1024 * 1024) throw new Error('รูปใหญ่เกิน 10MB');
  const path = `posts/${session.uid}/${Date.now()}_0.jpg`;
  let r;
  try {
    r = await fetch(`https://firebasestorage.googleapis.com/v0/b/${CONFIG.BUCKET}/o?uploadType=media&name=${encodeURIComponent(path)}`,
      { method: 'POST', headers: { Authorization: 'Firebase ' + await idToken(), 'Content-Type': 'image/jpeg' }, body: blob });
  } catch (e) { throw netError(e); }
  if (!r.ok) throw new Error(r.status === 403 ? 'อัปโหลดรูปไม่สำเร็จ (ยืนยันอีเมลแล้วหรือยัง?)' : 'อัปโหลดรูปไม่สำเร็จ');
  return path;
}
async function submitPost(ev) {
  ev.preventDefault();

  const form = $('#composer'); form.classList.add('opacity-60', 'pointer-events-none');
  try {
    const imageRefs = attached ? [await uploadPostImage(attached)] : [];
    const p = await api('/posts', { method: 'POST', body: { text, imageRefs, visibility: 'public' } });
    p.likedByMe = false; p._verified = S.me.isCreator === true;
    $('#postText').value = ''; attached = null; $('#postImage').value = ''; refreshComposer();
    if (S.feedTab !== 'all') setFeedTab('all'); else { S.posts.unshift(p); renderFeed(); }
    toast('โพสต์แล้ว');
  } catch (e) { toast(e.data?.code === 'moderated' ? e.message : 'โพสต์ไม่สำเร็จ: ' + e.message, 3500); }

}

      if (!c) return null;

      return { id, title: c.title || ou.displayName || 'แชท', avatar: c.avatar || ou.avatar, last: c.lastMessage || '', at: c.lastAt || uc[id] || 0,

function renderVideoPage() {
  const vids = S.posts.filter(p => (p.images || []).some(isVideo));
  $('#page-video').innerHTML = `<h2 class="pb-3 text-[20px] font-semibold">วิดีโอ</h2>` + (vids.length ? `<div class="grid grid-cols-1 gap-3">${vids.map(postCard).join('')}</div>` : '<div class="py-16 text-center text-muted">ยังไม่มีวิดีโอ</div>');
}
async function renderProfilePage() {
  const u = S.me;
  $('#page-profile').innerHTML = `<div class="flex flex-col items-center text-center">
      <span class="ring-neon rounded-full p-[3px]"><img src="${avatar(u.avatar)}" alt="" class="h-24 w-24 rounded-full border-2 border-ink object-cover"></span>
      <div class="mt-3 flex items-center gap-1 text-[20px] font-semibold">${esc(u.displayName || 'ผู้ใช้')}${u.isCreator ? BADGE : ''}</div>
      ${u.username ? `<div class="text-[13px] text-muted">@${esc(u.username)}</div>` : ''}
      ${u.bio ? `<p class="mt-2 max-w-[320px] whitespace-pre-line text-[14px] text-[#d9d3f7]">${esc(u.bio)}</p>` : ''}
      <div class="mt-4 flex gap-3"><div class="rounded-2xl bg-[#1a1440] px-5 py-2"><div class="font-semibold text-[#ffe08a]">${fmtNum(S.coins)}</div><div class="text-[12px] text-muted">เหรียญ</div></div>
        <div class="rounded-2xl bg-[#1a1440] px-5 py-2"><div class="font-semibold text-[#bfe8ff]">${fmtNum(S.diamonds)}</div><div class="text-[12px] text-muted">เพชร</div></div></div>
      <button id="logoutBtn" class="mt-4 rounded-full border border-line px-5 py-2 text-[14px] text-muted">ออกจากระบบ</button></div>
    <h3 class="mb-2 mt-6 text-[16px] font-semibold">โพสต์ของฉัน</h3><div id="myPosts" class="grid grid-cols-2 gap-2.5"><div class="skel h-[200px] rounded-2xl"></div><div class="skel h-[200px] rounded-2xl"></div></div>`;
  $('#logoutBtn').onclick = logout;
  try {
    S.myPosts = await withVerified((await api('/feed?limit=20&author=' + encodeURIComponent(session.uid))).posts || []);
    $('#myPosts').innerHTML = S.myPosts.length ? S.myPosts.map(postCard).join('') : '<div class="col-span-2 py-8 text-center text-muted">ยังไม่มีโพสต์</div>';
  } catch (e) { $('#myPosts').innerHTML = `<div class="col-span-2 py-8 text-center text-muted">${esc(e.message)}</div>`; }
}
function openAllLives() {
  openFull('ไลฟ์สดตอนนี้', `<div class="grid grid-cols-2 gap-2.5 p-3">${(S.lives || []).map(l => liveCard(l, true)).join('') || '<div class="col-span-2 py-16 text-center text-muted">ยังไม่มีใครไลฟ์ตอนนี้</div>'}</div>`, body => body.addEventListener('click', onLiveClick));
}
function onLiveClick(ev) {
  const b = ev.target.closest('[data-live]'); if (!b) return;
  const l = (S.lives || []).find(x => x.id === b.dataset.live);
  toast(l?.title ? `“${l.title}” — เข้าชมไลฟ์ได้ในแอป FriendTalk` : 'เข้าชมไลฟ์ได้ในแอป FriendTalk');
}
async function openUser(uid) {
  if (!uid || uid === session.uid) return switchTab('profile');
  const u = await userOf(uid); const dist = distOf(uid);
  openSheet('', `<div class="flex flex-col items-center pb-2 text-center">
      <span class="ring-neon rounded-full p-[3px]"><img src="${avatar(u.avatar)}" alt="" class="h-20 w-20 rounded-full border-2 border-ink object-cover"></span>
      <div class="mt-2 flex items-center gap-1 text-[18px] font-semibold">${esc(u.displayName || 'ผู้ใช้')}${u.isCreator ? BADGE : ''}</div>
      <div class="text-[13px] text-muted">${[u.age ? u.age + ' ปี' : '', dist ? 'ห่าง ' + dist : ''].filter(Boolean).map(esc).join(' • ')}</div>
      ${u.bio ? `<p class="mt-2 whitespace-pre-line text-[14px]">${esc(u.bio)}</p>` : ''}
      <button id="addFr" class="mt-4 w-full rounded-2xl bg-gradient-to-r from-neon to-violet py-3 font-semibold">เพิ่มเพื่อน</button></div>`,
    body => body.querySelector('#addFr').onclick = () => addFriend(uid, body.querySelector('#addFr')));
}
async function addFriend(uid, btn) {
  try {
    const r = await api('/friends/request', { method: 'POST', body: { toUid: uid } });
    const msg = { requested: 'ส่งคำขอแล้ว', friends: 'เป็นเพื่อนกันแล้ว', already_friends: 'เป็นเพื่อนกันอยู่แล้ว' }[r.status] || 'ส่งคำขอแล้ว';
    if (btn) { btn.textContent = msg; btn.disabled = true; btn.classList.add('opacity-60'); }
    toast(msg);
  } catch (e) { toast(e.message); }
}

/* ---------------- การนำทาง ---------------- */
let currentTab = 'home';
const TABS = ['home', 'friends', 'messages', 'video', 'profile'];
function paintNav() {
  document.querySelectorAll('#bottomNav [data-tab]').forEach(b => {
    const on = b.dataset.tab === currentTab;
    b.style.color = on ? '#c77dff' : '#cfc9ee';
    b.querySelector('svg').classList.toggle('icon-glow', on);
    b.querySelectorAll('.ic').forEach(p => { p.setAttribute('fill', on ? 'url(#navGrad)' : 'none'); p.setAttribute('stroke', on ? '#d9a8ff' : 'currentColor'); p.setAttribute('stroke-width', '1.6'); p.setAttribute('stroke-linejoin', 'round'); });
    b.querySelector('span:last-child').classList.toggle('glow-text', on);
  });
}
function switchTab(t, push = true) {
  if (!TABS.includes(t)) t = 'home';
  currentTab = t;
  document.querySelectorAll('main[data-page]').forEach(m => m.classList.toggle('hidden', m.dataset.page !== t));
  paintNav(); window.scrollTo(0, 0);
  if (push && location.hash !== '#' + t) history.pushState(null, '', t === 'home' ? location.pathname + location.search : '#' + t);
  if (t === 'friends') { renderFriendsPage(); if (S.nearby && !S.nearby.length) loadNearby(); }
  if (t === 'messages') { renderMessagesPage(); loadChats(); }
  if (t === 'video') renderVideoPage();
  if (t === 'profile') renderProfilePage();
}

/* ---------------- เริ่มต้น ---------------- */
function showLogin() { $('#login').classList.remove('hidden'); }
let started = false;
async function start() {
  $('#login').classList.add('hidden');
  if (started) return location.reload();
  started = true;
  switchTab((location.hash || '#home').slice(1), false);
  setFeedTab('all');
  try { await loadMe(); } catch (e) { if (e.status === 401) return logout(); }
  loadWallet(); loadLives(); loadNearby(); loadNotif(); loadChats();
  setInterval(() => { if (document.visibilityState === 'visible') { loadWallet(); loadNotif(); loadChats(); } }, 45000);
}

document.body.insertAdjacentHTML('afterbegin', '<svg width="0" height="0" class="absolute"><defs><linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d48bff"/><stop offset="1" stop-color="#8b3dff"/></linearGradient></defs></svg>');
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault(); $('#loginErr').textContent = '';
  const btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ…';
  try { await login($('#loginEmail').value.trim(), $('#loginPass').value); start(); }
  catch (e) { $('#loginErr').textContent = e.status === 0 ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' : e.message; }
  finally { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
});
$('#bottomNav').addEventListener('click', ev => { const b = ev.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
document.querySelector('#page-home [data-tab="friends"]').addEventListener('click', () => switchTab('friends'));
$('#hdrAvatarBtn').onclick = () => switchTab('profile');
$('#coinBtn').onclick = openCoins; $('#gemBtn').onclick = openGems; $('#bellBtn').onclick = openNotif;
document.querySelector('[data-go="lives"]').onclick = openAllLives;
$('#liveRow').addEventListener('click', onLiveClick);
$('#feedTabs').addEventListener('click', ev => { const b = ev.target.closest('[data-feed]'); if (b && b.dataset.feed !== S.feedTab) setFeedTab(b.dataset.feed); });
['#feed', '#page-video', '#page-profile'].forEach(s => $(s).addEventListener('click', onFeedClick));
document.addEventListener('click', ev => {
  const u = ev.target.closest('[data-user]'); if (u && !$('#login').contains(u)) { ev.preventDefault(); openUser(u.dataset.user); return; }
  const add = ev.target.closest('[data-add]'); if (add) return addFriend(add.dataset.add, add);
  const ch = ev.target.closest('#page-messages [data-chat]'); if (ch) openChat(ch.dataset.chat);
});
$('#composer').addEventListener('submit', submitPost);
$('#postText').addEventListener('input', refreshComposer);
$('#postImage').addEventListener('change', ev => { const f = ev.target.files[0]; if (f && !f.type.startsWith('image/')) return toast('เลือกได้เฉพาะไฟล์รูป'); attached = f || null; refreshComposer(); });
window.addEventListener('popstate', () => { if (!$('#overlay').classList.contains('hidden')) closeOverlay(); switchTab((location.hash || '#home').slice(1), false); });
window.addEventListener('scroll', () => { if (currentTab === 'home' && S.feedTab === 'all' && innerHeight + scrollY > document.body.scrollHeight - 600) loadFeed(); }, { passive: true });

loadSession();
if (session) start(); else showLogin();
</script>
</body>
</html>
