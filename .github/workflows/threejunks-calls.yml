# Test build of the Three Junks call integration (this branch only). Same signing key as the normal build, so the APK
# installs over an existing FriendTalk without losing data. No Play upload, no public release link.
name: Three Junks calls (test APK)

on:
  push:
    branches: [ "claude/github-3-jump-connect-i1cajl" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # read the newest normal build number (version code)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

      # same version code as the newest normal build: installs over it, and the next normal build still updates it
      - name: Version code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh run list --workflow build_apk.yml --limit 1 --json number --jq '.[0].number' || true)
          echo "VERSION_CODE=${n:-4}" >> "$GITHUB_ENV"
          echo "version code ${n:-4}"

      - name: Build sideload release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleSideloadRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FriendTalk-threejunks-apk
          path: app/build/outputs/apk/sideload/release/app-sideload-release.apk
          if-no-files-found: error
          compression-level: 0
