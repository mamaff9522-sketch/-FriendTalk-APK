name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Fixed Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          # เก็บเฉพาะตัวอักษรที่เป็น Base64 จริง
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -cd 'A-Za-z0-9+/=' \
            > keystore.clean.base64

          echo "Clean Base64 length:"
          wc -c keystore.clean.base64

          # ถอดกลับเป็นไฟล์ JKS
          base64 --decode keystore.clean.base64 > my-upload-key.jks

          echo "Decoded JKS size:"
          stat -c%s my-upload-key.jks

          # ไฟล์ต้นฉบับของเราที่ตรวจใน Termux = 2247 bytes
          if [ "$(stat -c%s my-upload-key.jks)" -ne 2247 ]; then
            echo "::error::Keystore size is not 2247 bytes"
            exit 1
          fi

          echo "Keystore restored correctly"

      - name: Verify Keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify Signed APK
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendTalk-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
