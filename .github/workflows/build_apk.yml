name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Verify APK Integrity and Prepare Staging
      run: |
        APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
        if [ ! -f "$APK_SRC" ]; then
          echo "::error::Build output APK not found at $APK_SRC"
          exit 1
        fi

        APK_SIZE=$(stat -c%s "$APK_SRC" 2>/dev/null || stat -f%z "$APK_SRC" 2>/dev/null)
        echo "APK Source: $APK_SRC"
        echo "APK File Size: $APK_SIZE bytes"
        if [ "$APK_SIZE" -lt 5000000 ]; then
          echo "::error::APK file size is suspiciously small ($APK_SIZE bytes)"
          exit 1
        fi

        # Test ZIP integrity of the original APK
        unzip -t "$APK_SRC" > /dev/null && echo "Original APK zip structure is valid: OK"

        # Stage to clean distribution directory for direct 1:1 artifact upload
        mkdir -p dist
        cp "$APK_SRC" dist/app-debug.apk
        ls -lh dist/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FriendTalk-debug-apk
        path: dist/app-debug.apk
        if-no-files-found: error
        compression-level: 0
        overwrite: true
