name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Fixed Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s "my-upload-key.jks" ]; then
            echo "::error::Failed to restore my-upload-key.jks"
            exit 1
          fi

          echo "Fixed keystore restored successfully"

      - name: Verify Keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing"
            exit 1
          fi

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD secret is missing"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify Signed APK
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK not found at $APK_FILE"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")

          echo "=========================================================="
          echo "APK FILE: $APK_FILE"
          echo "APK SIZE: $FILE_SIZE bytes"
          echo "=========================================================="

          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "::error::APK file is unexpectedly small"
            exit 1
          fi

          unzip -t "$APK_FILE" > /dev/null

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_FILE")

          RAW_SHA1=$(echo "$CERT_OUTPUT" \
            | grep -i "SHA-1 digest" \
            | head -n 1 \
            | awk '{print $NF}')

          RAW_SHA256=$(echo "$CERT_OUTPUT" \
            | grep -i "SHA-256 digest" \
            | head -n 1 \
            | awk '{print $NF}')

          FORMATTED_SHA1=$(echo "$RAW_SHA1" \
            | sed 's/..\B/&:/g' \
            | tr '[:lower:]' '[:upper:]')

          FORMATTED_SHA256=$(echo "$RAW_SHA256" \
            | sed 's/..\B/&:/g' \
            | tr '[:lower:]' '[:upper:]')

          echo "=========================================================="
          echo "FIXED RELEASE SIGNING CERTIFICATE"
          echo "=========================================================="
          echo "SHA-1   : $FORMATTED_SHA1"
          echo "SHA-256 : $FORMATTED_SHA256"
          echo "=========================================================="

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendTalk-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
